<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>myworlds — your name, your planet</title>
  <meta name="description" content="Type a name, get a tiny low-poly planet. Same name, same world.">
  <meta name="theme-color" content="#070a16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%233a8fd9'/><path d='M30 40 L55 28 L70 45 L58 66 L34 62 Z' fill='%236fbf5a'/></svg>">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body>
  <canvas id="c"></canvas>

  <aside id="panel">
    <header>
      <h1><span class="logo">✦</span> myworlds</h1>
      <div class="hbtns">
        <button id="mute" type="button" aria-label="Mute music" aria-pressed="false" title="Music on/off">🔊</button>
        <button id="toggle" type="button" aria-label="Toggle panel">☰</button>
      </div>
    </header>
    <div class="body">
      <form id="seed-form" autocomplete="off">
        <input id="seed" type="text" maxlength="40" placeholder="Your name or a word…" enterkeyhint="go" spellcheck="false">
        <button type="submit" class="go">Generate</button>
        <button type="button" id="dice" title="Random world" aria-label="Random world">🎲</button>
      </form>
      <p class="sub">Same name, same world. Every time.</p>
      <h2>Your worlds</h2>
      <div id="worlds"></div>
      <div class="actions"><button type="button" id="share" class="ghost">Share link</button></div>
      <label class="music" for="vol"><span>Music</span><input id="vol" type="range" min="0" max="100" step="1" aria-label="Music volume"></label>
    </div>
  </aside>

  <section id="info" aria-live="polite"></section>
  <button type="button" id="info-pill" class="ghost" hidden aria-label="Show world card"></button>

  <section id="creature" hidden aria-live="polite">
    <div class="ccard">
      <button type="button" class="cclose" aria-label="Close">×</button>
      <div class="cview"><canvas id="ccv"></canvas><span class="cpath">path trace, time sped up</span></div>
      <div class="ctext">
        <div class="cname"></div>
        <div class="clatin"></div>
        <dl class="ctags"></dl>
        <p class="cstory"></p>
        <div class="cnav"><button type="button" class="ghost cprev">‹ Previous</button><button type="button" class="ghost cnext">Next ›</button></div>
      </div>
    </div>
  </section>

  <div id="hint">drag to spin and tilt · scroll or pinch to zoom · get close to find the wildlife</div>

  <div id="overlay">
    <div class="box">
      <div class="orb"></div>
      <div id="overlay-label">Seeding the void</div>
      <div class="track"><div id="overlay-bar"></div></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
