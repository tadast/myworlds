<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>My Worlds — every name hides a planet</title>
  <meta name="description" content="Every name hides a planet. Type yours and meet its creatures, its weather, and its song.">
  <meta name="theme-color" content="#070a16">
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="My Worlds">
  <meta property="og:title" content="My Worlds — every name hides a planet">
  <meta property="og:description" content="Every name hides a planet. Type yours and meet its creatures, its weather, and its song.">
  <meta property="og:url" content="https://codeme.lt/myworlds/">
  <meta property="og:image" content="https://codeme.lt/myworlds/assets/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A low-poly ocean planet in space beside the words My Worlds and Every name hides a planet.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Worlds — every name hides a planet">
  <meta name="twitter:description" content="Every name hides a planet. Type yours and meet its creatures, its weather, and its song.">
  <meta name="twitter:image" content="https://codeme.lt/myworlds/assets/share.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body>
  <canvas id="c"></canvas>

  <aside id="panel" aria-label="Sidebar">
    <header>
      <h1><span class="logo">✦</span> My Worlds</h1>
      <span id="hworld" class="hworld"></span>
      <div class="hbtns">
        <button id="probe-icon" type="button" class="probe-icon" aria-label="Send a probe to the surface" title="Send a probe to the surface" hidden>🛸</button>
        <button id="mute" type="button" aria-label="Unmute music" aria-pressed="true" title="Music on/off">🔇</button>
        <button id="toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="Show/hide sidebar">☰</button>
      </div>
    </header>

    <div class="body">
      <section class="sec">
        <form id="seed-form" autocomplete="off">
          <input id="seed" type="text" maxlength="40" placeholder="Your name or a word…" enterkeyhint="go" spellcheck="false" aria-label="Seed">
          <button type="submit" class="go">Generate</button>
          <button type="button" id="dice" title="Random world" aria-label="Random world">🎲</button>
        </form>
        <p class="sub">Every name hides a planet. The same name always finds the same one.</p>
      </section>

      <section class="sec" id="info" aria-live="polite" hidden>
        <div class="sechead">
          <h2>This world</h2>
          <button type="button" id="share" class="ghost">Share link</button>
        </div>
        <div id="info-body"></div>
        <button type="button" id="probe" class="probe" hidden>Send a probe to the surface</button>
      </section>

      <section class="sec">
        <div class="sechead"><h2>Your worlds</h2></div>
        <div id="worlds"></div>
      </section>
    </div>

    <footer>
      <label class="music" for="vol"><span>Music</span><input id="vol" type="range" min="0" max="100" step="1" aria-label="Music volume"></label>
      <p class="help" id="help">Drag to spin and tilt · scroll or pinch to zoom · get close to find the wildlife</p>
    </footer>
  </aside>

  <section id="creature" hidden aria-live="polite">
    <div class="ccard">
      <button type="button" class="cclose" aria-label="Close">×</button>
      <!-- One card, two subjects. A WebGLRenderer owns the canvas it draws to, so the animal
           preview and the plant preview keep one canvas each and the card shows one of them. -->
      <div class="cview"><canvas id="ccv"></canvas><canvas id="pcv" hidden></canvas></div>
      <div class="ctext">
        <div class="cname"></div>
        <div class="clatin"></div>
        <dl class="ctags"></dl>
        <p class="cstory"></p>
        <div class="cnav"><button type="button" class="ghost cprev">‹ Previous</button><button type="button" class="ghost cnext">Next ›</button></div>
      </div>
    </div>
  </section>

  <p id="aim" role="status" hidden>Select the area to send a probe</p>
  <button type="button" id="probe-float" class="floatbtn">Recall the probe</button>
  <button type="button" id="creature-float" class="floatbtn">Study the creature</button>
  <div id="dive" aria-hidden="true"><p id="dive-label"></p></div>

  <div id="overlay">
    <div class="box">
      <div class="orb"></div>
      <div id="overlay-label">Seeding the void</div>
      <div class="track"><div id="overlay-bar"></div></div>
    </div>
  </div>

  <!-- The worker loads lore.js and species.js too. The page needs them for Species.bodyMetres(),
       because the ground scales a creature to the size its lore states. species.js reads
       window.Lore, so lore.js goes first. A classic script runs before a module, so both are
       there when app.js starts.
       The page does not load flora-lore.js. The plant lore is written in the worker, at patch
       time, and it crosses to the page as plain data on the patch result. -->
  <script src="./lore.js"></script>
  <script src="./species.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
