<!doctype html>
<!-- PROTOTYPE — throwaway. Three concepts for the whole UI of My Worlds, switchable with ?variant=A|B|C.
     The real app runs full screen in the iframe with its own chrome hidden; each concept is an overlay
     that drives it through window.__mw. Question and verdict: tools/ui-prototype/NOTES.md. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>My Worlds — UI concepts (prototype)</title>
  <meta name="theme-color" content="#070a16">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { position: fixed; inset: 0; margin: 0; overflow: hidden; background: #070a16; overscroll-behavior: none;
      -webkit-text-size-adjust: 100%; touch-action: manipulation; }
    #app { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    #ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    #ui * { -webkit-tap-highlight-color: transparent; }

    /* the switcher of the prototype: not part of any concept */
    #proto { position: fixed; z-index: 1000; left: 50%; top: max(6px, env(safe-area-inset-top)); transform: translateX(-50%);
      display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px;
      background: #fff; color: #111; font: 600 12px/1 system-ui, -apple-system, sans-serif;
      box-shadow: 0 6px 24px rgba(0,0,0,.45); opacity: .92; }
    #proto button { all: unset; cursor: pointer; padding: 6px 9px; border-radius: 999px; white-space: nowrap; }
    #proto button:hover { background: #eee; }
    #proto .lbl { padding: 6px 4px; min-width: 0; white-space: nowrap; }
    #proto .lbl b { font-weight: 800; }
    #proto.min .lbl span, #proto.min .x { display: none; }
    #proto-map { position: fixed; z-index: 999; left: 50%; top: calc(max(6px, env(safe-area-inset-top)) + 40px); transform: translateX(-50%);
      width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 70px); overflow: auto; padding: 18px 20px; border-radius: 16px;
      background: #fff; color: #111; font: 14px/1.45 system-ui, -apple-system, sans-serif; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    #proto-map[hidden] { display: none; }
    #proto-map h3 { margin: 0 0 4px; font-size: 17px; }
    #proto-map h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #666; }
    #proto-map p { margin: 0 0 6px; }
    #proto-map pre { margin: 0; padding: 10px 12px; background: #f3f3f6; border-radius: 10px; font: 12px/1.45 ui-monospace, Menlo, monospace; overflow: auto; }
    #proto-map ol { margin: 0; padding-left: 20px; }
    @media (max-width: 520px) {
      #proto { top: 34%; left: 0; transform: none; flex-direction: column; border-radius: 0 12px 12px 0; padding: 3px 2px; font-size: 11px; opacity: .85; }
      #proto button { padding: 6px 7px; }
      #proto .lbl { padding: 2px 0; }
      #proto .lbl span { display: none; }
      #proto-map { top: 12px; }
    }
  </style>
</head>
<body>
  <iframe id="app" title="My Worlds" allow="autoplay; clipboard-write"></iframe>
  <div id="ui"></div>
  <nav id="proto" aria-label="Prototype switcher">
    <button type="button" data-go="-1" title="Previous concept ( [ )">◀</button>
    <div class="lbl"><b id="proto-key">A</b> <span id="proto-name"></span></div>
    <button type="button" data-go="1" title="Next concept ( ] )">▶</button>
    <button type="button" class="x" id="proto-info" title="The map of this concept">ⓘ</button>
    <button type="button" class="x" id="proto-start" title="See the start screen again">↺</button>
    <button type="button" id="proto-min" title="Fold the switcher">–</button>
  </nav>
  <div id="proto-map" hidden></div>
  <script type="module" src="./ui-prototype/main.js"></script>
</body>
</html>
