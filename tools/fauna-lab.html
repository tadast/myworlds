<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fauna lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #0b1020; --fg: #e8ecff; --dim: #8e97bd; --line: #243056; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.35 system-ui, sans-serif; }
  header { padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header a { color: var(--dim); text-decoration: none; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; }
  header a.on { color: var(--fg); border-color: #6f86d6; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; padding: 0 16px 16px; }
  .cell { position: relative; height: 260px; border: 1px solid var(--line); border-radius: 8px; }
  .cell b { position: absolute; left: 8px; top: 6px; font-weight: 600; }
  .cell i { position: absolute; left: 8px; bottom: 6px; color: var(--dim); font-style: normal; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
</style>
<script type="importmap">
  { "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/addons/" } }
</script>
</head>
<body>
<header>
  <strong>Fauna lab</strong>
  <span id="sets"></span>
  <span style="color:var(--dim)">?set=wings|whales|sails|tails|all · &amp;t=seconds freezes the clock · &amp;view=side|top|front · &amp;lod=coarse</span>
</header>
<div id="grid"></div>
<canvas id="c"></canvas>
<script type="module">
// A preview page for the creature builder. It builds hand-written genomes with the real
// buildCreature() and faunaMaterial(), so a change to fauna.js shows here without a world roll.
import * as THREE from 'three';
import { buildCreature, faunaMaterial } from '../fauna.js';

const q = new URLSearchParams(location.search);
const SET = q.get('set') || 'all';
const FREEZE = q.has('t') ? Number(q.get('t')) : null;
const VIEW = q.get('view') || 'three';
const LOD = q.get('lod') || 'full';

// the parts a locomotion always has, as species.js adds them
const ALWAYS = { sac: ['tendrils'], fins: ['flukes'], arch: ['mounds'], periscope: ['mounds'], plough: ['mounds'] };
const PAL = { fauna: { sand: '#c8b27f' }, flora: { canopy: '#4f9a52', trunk: '#6b4a2f' } };
const SKINS = [
  { body: '#5d7fae', body2: '#39506f', accent: '#e59a5b', glow: '#9ff5ff' },
  { body: '#8a6aa8', body2: '#4f3b66', accent: '#f0d36a', glow: '#ffb0f0' },
  { body: '#6c9a6a', body2: '#3f5c40', accent: '#d9695f', glow: '#e8ff9a' },
  { body: '#b0875a', body2: '#6a4e33', accent: '#7fc6d8', glow: '#ffe7a8' },
  { body: '#7d8c9c', body2: '#dfe6ee', accent: '#5aa0c8', glow: '#b8f0ff' },
];

// A genome with every field the builder and the rig read. The fields the lab does not set take
// the middle of the range species.js draws from.
function genome(o, i) {
  const loco = o.loco;
  const cls = ['sac', 'wings', 'fins'].includes(loco) ? 'air' : ['arch', 'periscope', 'plough'].includes(loco) ? 'sub' : 'land';
  const G = {
    cls, niche: 'meadow', loco, plan: o.plan || 'blob', head: o.head || 'none', extras: [...new Set([...(ALWAYS[loco] || []), ...(o.extras || [])])],
    segs: o.segs || (o.plan === 'chain' ? 6 : 1), bodyR: o.bodyR ?? (loco === 'fins' ? 0.3 : 0.22),
    stretch: o.plan === 'spindle' && cls === 'land' ? 0.6 : 1,
    legLen: o.legLen ?? ({ monopod: 0.5, biped: 0.62, tripod: 0.5, quad: 0.38, hexapod: 0.2, roller: 0.16 }[loco] || 0),
    jointed: o.jointed ?? true, gait: o.gait || 2, flap: o.flap || (loco === 'fins' ? 1.4 : 4.4), slow: o.slow ?? 1.0,
    size: 1, hover: 0, rings: 6, gravity: 1,
    move: { leash: 0, speed: 0, turn: 0, pause: 0, flies: cls === 'air', shadow: true, mode: 'wander', loco },
    colors: SKINS[(o.skin ?? i) % SKINS.length],
  };
  for (const k of ['wingStyle', 'whaleHead']) if (o[k]) G[k] = o[k];
  return G;
}

const SETS = {
  wings: [
    { label: 'flapper · blob', loco: 'wings', plan: 'blob', head: 'beak', wingStyle: 'flap' },
    { label: 'flapper · crest + tail', loco: 'wings', plan: 'blob', head: 'crest', extras: ['tail'], wingStyle: 'flap' },
    { label: 'glider · blob', loco: 'wings', plan: 'blob', head: 'beak', wingStyle: 'glide', extras: ['tail'] },
    { label: 'glider · spindle', loco: 'wings', plan: 'spindle', head: 'none', wingStyle: 'glide' },
    { label: 'flitter · spindle (4 wings)', loco: 'wings', plan: 'spindle', head: 'mandibles', wingStyle: 'flit', extras: ['tendrils'] },
    { label: 'flitter · blob', loco: 'wings', plan: 'blob', head: 'mandibles', wingStyle: 'flit', extras: ['beads'] },
  ],
  whales: [
    { label: 'whale · plain', loco: 'fins', plan: 'spindle', whaleHead: 'hull' },
    { label: 'whale · beak + beads', loco: 'fins', plan: 'spindle', head: 'beak', extras: ['beads'], whaleHead: 'hull' },
    { label: 'whale · crest + sail', loco: 'fins', plan: 'spindle', head: 'crest', extras: ['sail'], whaleHead: 'hull' },
    { label: 'bladder-head · plain', loco: 'fins', plan: 'spindle', whaleHead: 'bladder' },
    { label: 'bladder-head · tendrils', loco: 'fins', plan: 'spindle', extras: ['tendrils'], whaleHead: 'bladder' },
    { label: 'bladder-head · spikes', loco: 'fins', plan: 'spindle', extras: ['spikes'], whaleHead: 'bladder' },
  ],
  sails: [
    { label: 'quad · sail', loco: 'quad', plan: 'blob', head: 'tusks', extras: ['sail'] },
    { label: 'quad spindle · sail', loco: 'quad', plan: 'spindle', head: 'beak', extras: ['sail'] },
    { label: 'biped · sail', loco: 'biped', plan: 'blob', head: 'crest', extras: ['sail'] },
    { label: 'serpent · sail', loco: 'serpent', plan: 'chain', head: 'mandibles', extras: ['sail'] },
    { label: 'monopod · sail', loco: 'monopod', plan: 'dome', head: 'beak', extras: ['sail'] },
    { label: 'wings · sail', loco: 'wings', plan: 'blob', head: 'beak', extras: ['sail'], wingStyle: 'glide' },
  ],
  tails: [
    { label: 'quad · tail', loco: 'quad', plan: 'blob', head: 'tusks', extras: ['tail'] },
    { label: 'biped · tail', loco: 'biped', plan: 'spindle', head: 'beak', extras: ['tail'] },
    { label: 'monopod · tail', loco: 'monopod', plan: 'blob', head: 'stalks', extras: ['tail'] },
    { label: 'slinger · tail', loco: 'slinger', plan: 'spindle', head: 'beak', extras: ['tail'] },
    { label: 'sac · tail', loco: 'sac', plan: 'blob', head: 'lure', extras: ['tendrils', 'tail'] },
    { label: 'flapper · tail', loco: 'wings', plan: 'blob', head: 'crest', extras: ['tail'], wingStyle: 'flap' },
  ],
};
SETS.all = [...SETS.wings, ...SETS.whales, ...SETS.sails, ...SETS.tails];

document.getElementById('sets').innerHTML = Object.keys(SETS)
  .map((k) => `<a href="?set=${k}${FREEZE !== null ? `&t=${FREEZE}` : ''}${VIEW !== 'three' ? `&view=${VIEW}` : ''}" class="${k === SET ? 'on' : ''}">${k}</a>`).join(' ');

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setScissorTest(true);

const grid = document.getElementById('grid');
const cells = SETS[SET].map((o, i) => {
  const el = document.createElement('div');
  el.className = 'cell';
  grid.appendChild(el);
  const G = genome(o, i);
  const geo = buildCreature(G, PAL, PAL.flora, LOD);
  const tris = geo.attributes.position.count / 3;
  el.innerHTML = `<b>${o.label}</b><i>${tris} triangles</i>`;
  geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(new Float32Array([0]), 1));
  geo.setAttribute('aAnim', new THREE.InstancedBufferAttribute(new Float32Array([1, 0, 0, 0]), 4));
  geo.setAttribute('aAnchor', new THREE.InstancedBufferAttribute(new Float32Array([0, 0, 0]), 3));
  const mesh = new THREE.InstancedMesh(geo, faunaMaterial(G), 1);
  mesh.frustumCulled = false;
  const box = new THREE.Box3().setFromBufferAttribute(geo.attributes.position);
  const size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
  const fit = 1.3 / Math.max(size.x, size.y, size.z);
  mesh.scale.setScalar(fit);
  mesh.position.set(-mid.x * fit, -mid.y * fit, -mid.z * fit);
  const scene = new THREE.Scene();
  scene.add(mesh);
  const sun = new THREE.DirectionalLight('#fff4e0', 2.6); sun.position.set(2.5, 4, 3);
  scene.add(sun, new THREE.HemisphereLight('#9fbfff', '#3a2a1a', 0.8));
  const fill = new THREE.DirectionalLight('#6a86d8', 0.5); fill.position.set(-3, 1, -2); scene.add(fill);
  const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50);
  return { el, G, mesh, scene, camera, phase: i * 0.37 };
});

function place(cam, t, phase) {
  const r = 3.4;
  if (VIEW === 'side') cam.position.set(r, 0.25, 0);
  else if (VIEW === 'top') cam.position.set(0.001, r, 0);
  else if (VIEW === 'front') cam.position.set(0, 0.35, r);
  else if (FREEZE !== null) cam.position.set(r * 0.78, r * 0.42, r * 0.5);
  else { const a = t * 0.25 + phase; cam.position.set(Math.sin(a) * r, r * 0.38, Math.cos(a) * r); }
  cam.lookAt(0, 0, 0);
}

const clock = new THREE.Clock();
function frame() {
  const t = FREEZE ?? clock.getElapsedTime();
  const w = canvas.clientWidth, h = canvas.clientHeight, pr = renderer.getPixelRatio();
  if (canvas.width !== Math.floor(w * pr) || canvas.height !== Math.floor(h * pr)) renderer.setSize(w, h, false);
  renderer.setScissor(0, 0, w, h); renderer.setViewport(0, 0, w, h); renderer.clear();
  for (const c of cells) {
    const r = c.el.getBoundingClientRect();
    if (r.bottom < 0 || r.top > h) continue;
    const sh = c.mesh.material.userData.shader;
    if (sh) sh.uniforms.uTime.value = t;
    const a = c.mesh.geometry.attributes.aAnim;
    a.array[1] = t * c.G.gait * 2; a.needsUpdate = true;
    c.camera.aspect = r.width / r.height; c.camera.updateProjectionMatrix();
    place(c.camera, t, c.phase);
    const y = h - r.bottom;
    renderer.setScissor(r.left, y, r.width, r.height);
    renderer.setViewport(r.left, y, r.width, r.height);
    renderer.render(c.scene, c.camera);
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
