<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#070a16;overflow:hidden;width:1200px;height:630px}
#wrap{position:relative;width:1200px;height:630px;overflow:hidden}
iframe{position:absolute;top:0;left:0;border:0;width:1760px;height:630px}
#scrim{position:absolute;inset:0;background:linear-gradient(100deg,rgba(7,10,22,0.94) 0%,rgba(7,10,22,0.86) 28%,rgba(7,10,22,0.4) 42%,rgba(7,10,22,0) 56%)}
#txt{position:absolute;left:76px;top:0;height:630px;display:flex;flex-direction:column;justify-content:center;gap:20px;
     font-family:Fredoka,system-ui,sans-serif;color:#eef1ff;width:600px}
h1{margin:0;font-size:86px;font-weight:600;letter-spacing:0.5px;line-height:1}
h1 .logo{color:#ffb86b}
p{margin:0;font-size:33px;font-weight:400;color:#eef1ff;line-height:1.35;max-width:470px}
.sub{font-size:25px;color:#9aa3c7}
.url{position:absolute;left:76px;bottom:56px;font-family:Fredoka,system-ui,sans-serif;font-size:22px;color:#7cc4ff;letter-spacing:0.4px}
</style></head><body>
<div id="wrap">
  <iframe id="f" src="../index.html#Auralis"></iframe>
  <div id="scrim"></div>
  <div id="txt">
    <h1><span class="logo">✦</span> My Worlds</h1>
    <p>Every name hides a planet.</p>
    <p class="sub">Type yours. Meet its creatures,<br>hear its song.</p>
  </div>
  <div class="url">codeme.lt/myworlds</div>
</div>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  const d = f.contentDocument, s = d.createElement('style');
  s.textContent = '#panel,#creature{display:none!important}';
  d.head.appendChild(s);
});
</script></body></html>
